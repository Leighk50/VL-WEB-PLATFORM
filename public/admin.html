<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Village Limits</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body class="admin-body"><div id="loginView" class="admin-login"><div class="login-card"><img src="/assets/images/logo-gold.png"><div class="eyebrow">Version 2</div><h1>Website administration</h1><form id="loginForm"><label>Username<input id="username" required></label><label>Password<input id="password" type="password" required></label><button class="btn">Sign in</button><p id="loginError"></p></form></div></div><div id="adminView" hidden><header class="admin-top"><strong>Village Limits · Version 2</strong><div><a class="btn outline-light" href="/" target="_blank">View website</a><button id="logoutBtn" class="btn">Sign out</button></div></header><div class="admin-shell"><aside class="admin-nav"><button class="active" data-panel="dashboard">Dashboard</button><button data-panel="menus">Menus</button><button data-panel="events">What's On</button><button data-panel="settings">Website Details</button></aside><main class="admin-main"><section id="panel-dashboard" class="admin-panel"><div class="admin-heading"><h1>Dashboard</h1><button id="saveAll" class="btn">Save all changes</button></div><div class="stat-grid"><div class="admin-card"><strong id="menuCount">0</strong><p>Visible menus</p></div><div class="admin-card"><strong id="dishCount">0</strong><p>Dishes</p></div><div class="admin-card"><strong id="eventCount">0</strong><p>Events</p></div></div><p id="saveStatus"></p></section><section id="panel-menus" class="admin-panel" hidden><div class="admin-heading"><h1>Menus</h1><button id="addMenu" class="btn">Add Menu</button></div><div id="menusEditor"></div></section><section id="panel-events" class="admin-panel" hidden><div class="admin-heading"><h1>What's On</h1><button id="addEvent" class="btn">Add Event</button></div><div id="eventsEditor" class="editor-grid"></div></section><section id="panel-settings" class="admin-panel" hidden><h1>Website Details</h1><label>Opening Hours<input data-setting="openingHours"></label><label>Telephone<input data-setting="telephone"></label><label>Email<input data-setting="email"></label><label>Address<textarea data-setting="address"></textarea></label></section></main></div></div><script src="/assets/js/admin.js"></script></body></html>
