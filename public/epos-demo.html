<header><h2>THE VILLAGE LIMITS · EPOS</h2>DEVELOPMENT DEMO — no live orders or payments</header><nav id="nav"></nav><main><div id="screen" class="panel"></div><aside class="panel"><h2 id="tableTitle"></h2><div id="tab"></div><h2 id="total"></h2><button id="printBills" class="print-bills">Print Table Bills</button><div class="sale-actions"><button id="send">Send Order</button><button id="pay">Pay / Record</button><button id="hold">Hold Sale</button><button id="clear">Clear Draft</button></div><p class="muted">Orders saved in this browser only.</p></aside></main>

<script>
const tables=[2,6,3,2,2,4,8,6,6,2,2];let items=[];
const mixers=["Tonic","Light Tonic","Elderflower Tonic","Mediterranean Tonic","Ginger Ale","Dash Coke","Dash Diet Coke","Dash Lemonade"],lager=["Top","Blackcurrant","Lime"];
const $=id=>document.getElementById(id),money=n=>"£"+(n/100).toFixed(2),key="vl-epos-main-demo-v1";
let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!state||!Array.isArray(state.tabs)||state.tabs.length!==11)state={tabs:tables.map(()=>[]),orders:[]};state.quick??=[];state.held??=[];state.payments??=[];state.tableTabs??=tables.map(()=>["Tab 1"]);state.tableTabs=state.tableTabs.map(x=>Array.isArray(x)&&x.length?x:["Tab 1"]);
let department="Drinks";const categoryGroups={Food:["Starters","Mains","Specials","Desserts","Sunday"],Drinks:["Draught","Bottles","Gin","Vodka","Whisky","Brandy","Other Spirits","Soft Drinks","Wine"]};let table=0,view="quick",category="Draught",product=null,preferredMeasures={Draught:"Pint",Spirits:"Single",Wine:"125ml","Soft Drinks":"Small"};const current=()=>view==="quick"?state.quick:state.tabs[table];const label=()=>view==="quick"?"Quick Sale":"Table "+(table+1);

// Shared table mode: PostgreSQL is authoritative for submitted items.
// Local browser storage holds only unsent drafts until the server acknowledges them.
const sharedToken=localStorage.getItem("vl_epos_device_token");
const sharedEnabled=Boolean(sharedToken);
let sharedTable=null,sharedLoading=false,sharedFailure="",sharedSubmitting=false;
const sharedDrafts=state.tabs.map(lines=>lines.filter(x=>!x.sent));
const sharedApi=async(number,method,payload)=>{
 const response=await fetch("/api/till/tables/"+number,{method,headers:{Authorization:"Bearer "+sharedToken,...(payload?{"Content-Type":"application/json"}:{})},body:payload?JSON.stringify(payload):undefined,cache:"no-store"});
 const result=await response.json();
 if(!response.ok)throw Error(result.message||result.error||"Database unavailable");
 return result;
};
function displayShared(){
 if(!sharedEnabled||view!=="till"||!sharedTable||Number(sharedTable.tableId)!==table+1)return;
 const sent=[];
 for(const tab of sharedTable.tabs||[])for(const item of tab.items||[])sent.push({
  name:item.name,price:Number(item.pricePence)*Number(item.quantity),tab:tab.label,sent:true,
  paid:false,measure:"",route:"",serverId:item.id
 });
 state.tabs[table]=[...sent,...sharedDrafts[table]];
 state.tableTabs[table]=(sharedTable.tabs||[]).map(t=>t.label);
 if(!state.tableTabs[table].length)state.tableTabs[table]=["Tab 1"];
}
async function loadSharedTable(number,{open=false}={}){
 if(!sharedEnabled)return;
 sharedLoading=true;
 try{
  if(open)await sharedApi(number,"POST",{action:"open"});
  const data=await sharedApi(number,"GET");
  if(table+1===number&&view==="till"){sharedTable=data;sharedFailure="";displayShared();render()}
 }catch(error){sharedFailure=error.message;if(table+1===number&&view==="till")render()}
 finally{sharedLoading=false}
}

const save=()=>localStorage.setItem(key,JSON.stringify(state));
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function button(text,fn){const b=node("button",text);b.onclick=fn;return b}
let sharedSnapshot=null,sharedError="",sharedLastUpdated=0;
async function refreshSharedTables(){
 const token=localStorage.getItem("vl_epos_device_token");
 if(!token){sharedError="Register this till first in Devices";return}
 try{
  const response=await fetch("/api/shared/tables",{headers:{Authorization:"Bearer "+token},cache:"no-store"});
  if(!response.ok)throw Error(response.status===401?"Device registration not authorised":"Shared database unavailable");
  const result=await response.json();
  if(!Array.isArray(result.tables)||result.tables.length!==11)throw Error("Unexpected shared table response");
  sharedSnapshot=result.tables;sharedError="";sharedLastUpdated=Date.now();
 }catch(error){sharedError=error.message}
 if(view==="tables")render();
}
function show(v){view=v;render();if(v==="tables")refreshSharedTables()}
function render(){const nav=$("nav");nav.replaceChildren();for(const v of ["quick","tables","till","kitchen","bar","shared test","manager"]){const b=button(v.toUpperCase(),()=>v==="shared test"?location.assign("/shared"):v==="manager"?location.assign("/manager"):v==="till"?show("tables"):show(v));if(view===v)b.className="active";nav.append(b)}
const screen=$("screen");screen.replaceChildren();const orderPanel=document.querySelector("main > aside.panel");orderPanel.hidden=view==="tables"||view==="kitchen"||view==="bar";
if(view==="tables"){
 screen.append(node("h2","Table plan"));
 const info=node("p",sharedError?"Shared database: "+sharedError:sharedSnapshot?"Shared database connected · last checked "+new Date(sharedLastUpdated).toLocaleTimeString():"Checking shared database…");
 info.className="muted";screen.append(info);
 screen.append(button("Refresh shared tables",refreshSharedTables));
 const grid=node("div","");grid.className="grid";
 tables.forEach((covers,i)=>{
  const shared=sharedSnapshot?.find(x=>Number(x.table_number)===i+1);
  const sharedCount=(shared?.tabs||[]).reduce((sum,t)=>sum+(t.items||[]).reduce((n,item)=>n+Number(item.quantity||0),0),0);
  const title="Table "+(i+1)+" · "+covers+" covers"+(i<2?" · Dog":"")+" · "+state.tabs[i].length+" local demo items"+(sharedSnapshot?" · "+sharedCount+" shared items":"");
  grid.append(button(title,()=>{table=i;sharedTable=null;show("till");if(sharedEnabled)loadSharedTable(i+1,{open:true})}));
 });screen.append(grid)
}
if(view==="quick"||view==="till"){
 const printTest=button("PRINT TEST RECEIPT",async()=>{
  const token=localStorage.getItem("vl_epos_device_token");
  if(!token)return alert("This till must be registered before submitting print jobs.");
  printTest.disabled=true;
  try{
   const response=await fetch("/api/print/test",{method:"POST",headers:{Authorization:"Bearer "+token},cache:"no-store"});
   const result=await response.json();
   if(!response.ok)throw Error(result.error||"Unable to queue receipt");
   alert("Test receipt queued in Azure. Job "+result.id+". The Master Till print worker must be connected to Azure before it can print.");
  }catch(error){alert("Print request failed: "+error.message)}
  finally{printTest.disabled=false}
 });
 screen.append(printTest);
 if(view==="till"&&sharedEnabled&&sharedTable?.sessionId){
  const queueBill=async(tabId)=>{
   const token=localStorage.getItem("vl_epos_device_token");
   const payload={tableNumber:table+1};if(tabId)payload.tabId=tabId;
   const response=await fetch("/api/print/bill",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store"});
   const result=await response.json();if(!response.ok)throw Error(result.error||"Bill could not be queued");
   // Printer routing is resolved by the site print service; no user prompt on success.
  };
  const printAll=button("PRINT TABLE BILL",async()=>{try{await queueBill()}catch(e){alert(e.message)}});
  screen.append(printAll);
  for(const tab of sharedTable.tabs||[]){
   const printTab=button("PRINT "+tab.label.toUpperCase(),async()=>{try{await queueBill(tab.id)}catch(e){alert(e.message)}});
   screen.append(printTab);
  }
 }
}
if(view==="quick"&&state.held.length){screen.append(button("Recall Held Sale ("+state.held.length+")",()=>{if(state.quick.length)return alert("Clear or hold the current quick sale first.");state.quick=state.held.pop();save();render()}))}
if(view==="till"||view==="quick"){screen.append(node("h2",view==="quick"?"Quick Sale · Bar & Counter":"Table "+(table+1)+" · Ordering"));if(view==="till"&&sharedEnabled){const note=node("p",sharedFailure?"Shared ordering unavailable: "+sharedFailure:sharedTable?"Shared PostgreSQL ordering active":"Connecting to shared table…");note.className="muted";screen.append(note)}const dept=node("div");dept.className="department-tabs";for(const d of ["Food","Drinks"]){const b=button(d.toUpperCase(),()=>{department=d;category=categoryGroups[d][0];render()},department===d?"active":"");dept.append(b)}screen.append(dept);
const tabs=node("div");tabs.className="category-tabs";for(const c of categoryGroups[department]){const b=button(c,()=>{category=c;render()},category===c?"active":"");tabs.append(b)}screen.append(tabs);
const measureBar=node("div");measureBar.className="measure-bar";const spiritCats=["Gin","Vodka","Whisky","Brandy","Other Spirits","Spirits"];const sizes=category==="Draught"?["Pint","Half"]:spiritCats.includes(category)?["Single","Double"]:category==="Wine"?["125ml","250ml","Bottle"]:category==="Soft Drinks"?["Small","Large"]:[];for(const size of sizes){const b=button(size,()=>{preferredMeasures[category]=size;render()},(preferredMeasures[category]||sizes[0])===size?"active":"");measureBar.append(b)}if(sizes.length)screen.append(measureBar);
const grid=node("div");grid.className="grid products";const shown=items.filter(x=>x[1]===category);for(const p of shown){const size=preferredMeasures[category]||sizes[0];const amount=p[4]?(p[4][size]??Object.values(p[4])[0]):p[2];const b=button(" ",()=>openItem(p),"product-tile");b.replaceChildren();b.append(node("strong",p[0]),node("small",money(amount)));grid.append(b)}if(!shown.length)screen.append(node("p","No products in this category yet. Products will be added from the ICR Touch import and website menus."));screen.append(grid)}
if(view==="kitchen"||view==="bar"){screen.append(node("h2",view==="kitchen"?"Kitchen orders":"Bar orders"));const orders=state.orders.filter(x=>x.route===view&&x.status!=="collected");if(!orders.length)screen.append(node("p","No outstanding orders"));for(const o of orders){const box=node("section","");box.className="panel";box.append(node("h3",o.origin+" — "+o.status));for(const i of o.items){const l=node("div","1 × "+i.name+(i.measure?" ("+i.measure+")":"")+(i.tab?" ["+i.tab+"]":"")+(i.modifier?" + "+i.modifier:"")+(i.garnishes?.length?" + "+i.garnishes.join(" + "):"")+(i.note?" — "+i.note:"")+(i.seat?" · Seat "+i.seat:""));l.className="line";box.append(l)}if(view==="kitchen"){const counts={};o.items.forEach(i=>counts[i.name]=(counts[i.name]||0)+1);box.append(node("strong","DISH SUMMARY"));for(const [name,count] of Object.entries(counts))box.append(node("div",count+" × "+name))}const next={new:"preparing",preparing:"ready",ready:"collected"}[o.status];box.append(button(next==="preparing"?"Start preparing":next==="ready"?"Mark ready":"Mark collected",()=>{o.status=next;save();render()}));screen.append(box)}}
if(view!=="quick"&&view!=="till"){return;} $("tableTitle").textContent=label();const tab=$("tab");tab.replaceChildren();let total=0;current().forEach((i,index)=>{total+=i.price;const line=node("div",(view==="quick"?"":(i.tab||"Tab 1")+" · ")+i.name+(i.measure?" · "+i.measure:"")+" — "+money(i.price)+(i.modifier?"\n↳ "+i.modifier:"")+(i.garnishes?.length?"\n↳ "+i.garnishes.join(" + "):"")+(i.note?"\nNOTE: "+i.note:""));line.className="line";line.style.whiteSpace="pre-line";if(i.paid)line.append(node("small","PAID"));if(!i.sent&&!i.paid)line.append(button("Remove",()=>{if(view==="till"&&sharedEnabled){const n=sharedDrafts[table].indexOf(i);if(n>=0)sharedDrafts[table].splice(n,1)}current().splice(index,1);save();render()}));tab.append(line)});$("total").textContent="Total "+money(total);$("printBills").hidden=view!=="till";}
let selectedModifier="";let selectedTab="Tab 1";let selectedGarnishes=[];const garnishOptions=["Ice","Lemon","Lime"];
/* Product-linked mixer pricing: null means not imported/verified, never free. */
let mixerCatalog=[];
const mixerDefinitions=[
 ["Tonic","900"],["Light Tonic","906"],["Elderflower Tonic","909"],
 ["Mediterranean Tonic","907"],["Ginger Ale","916"],["Dash Coke","805"],
 ["Dash Diet Coke","836"],["Dash Lemonade","812"]
];
function renderGarnishButtons(){const box=$("garnishButtons");box.replaceChildren();const drink=product&&product[3]==="bar";$("garnishHeading").hidden=!drink;box.hidden=!drink;if(!drink)return;for(const name of garnishOptions){const active=selectedGarnishes.includes(name);const b=button((active?"✓  ":"")+name,()=>{selectedGarnishes=active?selectedGarnishes.filter(x=>x!==name):[...selectedGarnishes,name];renderGarnishButtons()},active?"selected-modifier":"");b.setAttribute("aria-pressed",String(active));box.append(b)}}
function renderModifierButtons(){
 const p=product,box=$("modifierButtons");box.replaceChildren();
 const spirit=["Gin","Vodka","Whisky","Brandy","Other Spirits","Spirits"].includes(p[1]),draught=p[1]==="Draught";
 $("modifierHeading").hidden=!(spirit||draught);
 $("modifierHint").textContent=spirit?"Mixer prices must come from the imported EPOS products. Unpriced mixers cannot be added.":draught?"Lager additions are free.":"";
 if(!spirit&&!draught)return;
 const options=spirit?mixerCatalog:lager.map((name,index)=>({id:"lager-"+index,name,pricePence:0}));
 const none=button((selectedModifier===""?"✓  ":"")+"No addition",()=>{selectedModifier="";renderModifierButtons()},selectedModifier===""?"selected-modifier":"");none.setAttribute("aria-pressed",String(selectedModifier===""));box.append(none);
 for(const option of options){
   const priced=Number.isInteger(option.pricePence)&&option.pricePence>0;
   const valid=!spirit||priced;
   const label=option.name+(spirit?(priced?" · "+money(option.pricePence):" · Price pending"):" · Free");
   const b=button((selectedModifier===option.id?"✓  ":"")+label,()=>{selectedModifier=option.id;renderModifierButtons()},selectedModifier===option.id?"selected-modifier":"");b.setAttribute("aria-pressed",String(selectedModifier===option.id));
   b.disabled=!valid;
   if(!valid)b.title="Awaiting price from the ICR Touch product import";
   box.append(b);
 }
}
function renderTabAssignment(){const box=$("tabAssignment");box.replaceChildren();const options=view==="quick"?["Quick Sale"]:state.tableTabs[table];for(const name of options){const active=selectedTab===name;const b=button((active?"✓  ":"")+name,()=>{selectedTab=name;renderTabAssignment()},active?"selected-modifier":"");b.setAttribute("aria-pressed",String(active));box.append(b)}if(view!=="quick")box.append(button("+ New Tab",async()=>{const tabs=state.tableTabs[table];let n=1;while(tabs.includes("Tab "+n))n++;const next="Tab "+n;if(sharedEnabled){try{if(!sharedTable?.sessionId)throw Error("Table not connected");await sharedApi(table+1,"POST",{action:"addTab",label:next});await loadSharedTable(table+1);selectedTab=next;renderTabAssignment()}catch(e){alert("Could not create tab: "+e.message)}return}selectedTab=next;tabs.push(selectedTab);save();renderTabAssignment()}));}
function openItem(p){
 product=p;selectedModifier="";selectedGarnishes=[];selectedTab=view==="quick"?"Quick Sale":state.tableTabs[table][0];$("itemTitle").textContent=p[0];
 const measure=$("measure");measure.replaceChildren();
 for(const m of Object.keys(p[4]||{"Standard":p[2]}))measure.append(new Option(m,m));
 if(p[4]&&Object.hasOwn(p[4],preferredMeasures[p[1]]))measure.value=preferredMeasures[p[1]];
 renderModifierButtons();renderGarnishButtons();renderTabAssignment();$("note").value="";$("dialog").showModal();
}
$("cancel").onclick=()=>$("dialog").close();
$("add").onclick=()=>{
 const p=product,m=$("measure").value;
 const spirit=["Gin","Vodka","Whisky","Brandy","Other Spirits","Spirits"].includes(p[1]),draught=p[1]==="Draught";
 const option=selectedModifier?(spirit?mixerCatalog:lager.map((name,index)=>({id:"lager-"+index,name,pricePence:0}))).find(x=>x.id===selectedModifier):null;
 if(selectedModifier&&!option)return alert("Modifier not found.");
 if(spirit&&option&&(!Number.isInteger(option.pricePence)||option.pricePence<=0))return alert("Mixer price has not been imported.");
 const extra=option?.pricePence||0;
 const entry={name:p[0],productId:p[6],plu:p[5]||null,route:p[3],measure:p[4]?m:"",modifier:option?.name||"",modifierProductId:spirit?option?.id||null:null,modifierPLU:spirit?option?.plu||null:null,modifierPricePence:extra,garnishes:[...selectedGarnishes],tab:view==="quick"?"Quick Sale":selectedTab,price:(p[4]?p[4][m]:p[2])+extra,note:$("note").value.trim(),sent:false};current().push(entry);if(view==="till"&&sharedEnabled)sharedDrafts[table].push(entry);
 save();$("dialog").close();render();
};
function printTableBills(){
 if(view!=="till"){alert("Select a table first to print its split bills.");return}
 const lines=state.tabs[table];if(!lines.length){alert("This table has no items.");return}
 const target=$("billPreview");target.replaceChildren();
 const tabs=state.tableTabs[table].filter(name=>lines.some(x=>(x.tab||"Tab 1")===name));
 const extras=[...new Set(lines.map(x=>x.tab||"Tab 1"))].filter(name=>!tabs.includes(name));
 for(const tabName of [...tabs,...extras]){
   const billLines=lines.filter(x=>(x.tab||"Tab 1")===tabName);
   const bill=node("section");bill.className="bill-sheet";
   bill.append(node("h2","The Village Limits"),node("h3","Table "+(table+1)+" — "+tabName));
   let sum=0;
   for(const line of billLines){
     sum+=line.price;
     const item=node("div");item.className="bill-line";
     item.append(node("span",line.name+(line.measure?" · "+line.measure:"")),node("strong",money(line.price)));
     bill.append(item);
     if(line.modifier)bill.append(node("small","↳ "+line.modifier));
     if(line.garnishes?.length)bill.append(node("small","↳ "+line.garnishes.join(", ")));
   }
   bill.append(node("h3","Total "+money(sum)));target.append(bill);
 }
 window.print();
}
$("printBills").onclick=printTableBills;
$("send").onclick=async()=>{
 if(view!=="till"&&view!=="quick")return;
 const pending=current().filter(x=>!x.sent);
 if(!pending.length){show("quick");return}
 if(view==="till"&&sharedEnabled){
  if(sharedSubmitting)return;
  if(!sharedTable?.sessionId)return alert("Table is not connected. Unsent items are retained.");
  if(pending.some(x=>!x.productId||!x.measure||x.modifier||x.garnishes?.length||x.note))
   return alert("Shared staging currently supports plain catalogue items only. Additions and notes are not yet supported; the draft has been retained.");
  const groups=new Map();
  for(const item of pending){if(!groups.has(item.tab))groups.set(item.tab,[]);groups.get(item.tab).push(item)}
  sharedSubmitting=true;
  try{
   for(const [tabName,lines] of groups){
    const tab=sharedTable.tabs.find(t=>t.label===tabName&&t.status==="open");
    if(!tab)throw Error("Tab "+tabName+" is not available");
    const requestId=lines[0].requestId||crypto.randomUUID();
    lines.forEach(x=>x.requestId=requestId);
    save();
    await sharedApi(table+1,"POST",{action:"order",tabId:tab.id,requestId,lines:lines.map(x=>({productId:x.productId,measure:x.measure,quantity:1}))});
    for(const item of lines){const idx=sharedDrafts[table].indexOf(item);if(idx>=0)sharedDrafts[table].splice(idx,1);item.sent=true}
    save();
   }
   await loadSharedTable(table+1);
   show("quick");
  }catch(e){save();alert("Order not fully confirmed. Remaining draft retained. "+e.message)}
  finally{sharedSubmitting=false}
  return;
 }
 for(const route of ["kitchen","bar"]){const lines=pending.filter(x=>x.route===route);if(lines.length)state.orders.push({origin:label(),route,status:"new",items:structuredClone(lines)})}
 pending.forEach(x=>x.sent=true);save();show("quick");alert("Sent to DEMO queues only — no real printers");
};
$("clear").onclick=()=>{if(confirm("Clear current demo draft?")){if(view==="quick")state.quick=[];else state.tabs[table]=[];save();render()}};
$("hold").onclick=()=>{if(view!=="quick")return alert("Hold Sale is for Quick Sale only.");if(!state.quick.length)return;state.held.push(structuredClone(state.quick));state.quick=[];save();render();alert("Quick sale held. Use Recall Held to restore it.")};
$("pay").onclick=()=>{if(sharedEnabled&&view==="till")return alert("Payments are not enabled for shared PostgreSQL tables yet. No payment has been recorded.");
 let chosen=null,lines=current();
 if(view==="till"){
   const available=[...new Set(lines.filter(x=>!x.paid).map(x=>x.tab||"Tab 1"))];
   if(!available.length)return alert("No unpaid tabs on this table.");
   const requested=prompt("Which tab is paying?\n"+available.join("\n"),available[0]);
   if(requested===null)return;
   if(!available.includes(requested.trim()))return alert("Select one of the listed tabs.");
   chosen=requested.trim();
   lines=lines.filter(x=>(x.tab||"Tab 1")===chosen&&!x.paid);
 }else if(view!=="quick")return alert("Select Quick Sale or a table before recording payment.");
 const total=lines.reduce((sum,x)=>sum+x.price,0);
 if(!total)return alert("No unpaid items.");
 const method=prompt("Demo payment method: CASH or CARD","CARD");if(method===null)return;
 const m=method.trim().toUpperCase();if(!["CASH","CARD"].includes(m))return alert("Choose CASH or CARD.");
 if(!confirm("Record "+money(total)+" for "+(chosen||"Quick Sale")+" as "+m+"? No actual payment is taken."))return;
 state.payments.push({origin:label(),tab:chosen,method:m,amount:total,at:new Date().toISOString()});
 if(view==="quick")state.quick=[];else lines.forEach(x=>x.paid=true);
 save();render();alert("Demo payment recorded for "+(chosen||"Quick Sale")+". No card terminal was charged.");
};
async function loadCatalogue(){
 try{
   const response=await fetch("/catalogue-data.json",{cache:"no-store"});
   if(!response.ok)throw new Error("HTTP "+response.status);
   const catalogue=await response.json();
   if(!Array.isArray(catalogue.wet)||!Array.isArray(catalogue.food))throw new Error("Invalid catalogue");
   items=[...catalogue.wet,...catalogue.food].filter(p=>p.available===true&&Object.keys(p.measures||{}).length).map(p=>{
     const measures=p.measures||{};
     const first=Object.values(measures)[0];
     return [p.name,p.category,first,p.route,measures,p.plu||null,p.id];
   });
   const byPlu=new Map(catalogue.wet.map(p=>[p.plu,p]));
   mixerCatalog=mixerDefinitions.map(([name,plu])=>{
     const item=byPlu.get(plu),price=item?.priceLevelsPence?.[0];
     return {id:item?.id||"missing-"+plu,name,plu,pricePence:item?.available&&Number.isInteger(price)&&price>0?price:null};
   });
   render();
 }catch(error){
   console.error("EPOS catalogue load failed",error);
   const box=document.getElementById("screen");
   const msg=node("p","Catalogue could not be loaded. Ordering disabled: "+error.message);
   msg.className="muted";box.prepend(msg);
 }
}
render();loadCatalogue();setInterval(()=>{if(view==="tables")refreshSharedTables();if(sharedEnabled&&view==="till"&&!sharedLoading&&!sharedSubmitting)loadSharedTable(table+1)},5000);
