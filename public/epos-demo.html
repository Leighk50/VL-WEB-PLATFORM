<header><h2>THE VILLAGE LIMITS · EPOS</h2>DEVELOPMENT DEMO — no live orders or payments</header><nav id="nav"></nav><main><div id="screen" class="panel"></div><aside class="panel"><h2 id="tableTitle"></h2><div id="tab"></div><h2 id="total"></h2><div class="sale-actions"><button id="send">Send Order</button><button id="pay">Pay / Record</button><button id="hold">Hold Sale</button><button id="clear">Clear Draft</button></div><p class="muted">Orders saved in this browser only.</p></aside></main>
<dialog id="dialog"><h2 id="itemTitle"></h2><label>Measure<select id="measure"></select></label><label>Modifier<select id="modifier"></select></label><label id="mixerLabel">Mixer charge (£)<input id="mixerPrice" type="number" min="0.01" step="0.01" placeholder="Required for mixers"></label><label>Seat<select id="seat"></select></label><label>Individual instructions<textarea id="note" rows="3"></textarea></label><p><button id="cancel">Cancel</button><button id="add">Add item</button></p></dialog>
<script>
const tables=[2,6,3,2,2,4,8,6,6,2,2],items=[
["Baked Camembert","Starters",1200,"kitchen"],["Soup of the Day","Starters",850,"kitchen"],["Beer-Battered Haddock","Mains",1800,"kitchen"],["Limits Burger","Mains",1800,"kitchen"],["Rib Eye Steak","Mains",3000,"kitchen"],["Moretti","Draught",0,"bar",{"Pint":600,"Half":320}],["Gin (sample)","Spirits",0,"bar",{"Single":450,"Double":700}],["House White (sample)","Wine",0,"bar",{"125ml":550,"250ml":950,"Bottle":2400}],["Reserve Red (sample)","Wine",0,"bar",{"Bottle":3600}]];
const mixers=["Tonic","Light Tonic","Elderflower Tonic","Mediterranean Tonic","Ginger Ale","Dash Coke","Dash Diet Coke","Dash Lemonade"],lager=["Top","Blackcurrant","Lime"];
const $=id=>document.getElementById(id),money=n=>"£"+(n/100).toFixed(2),key="vl-epos-main-demo-v1";
let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!state||!Array.isArray(state.tabs)||state.tabs.length!==11)state={tabs:tables.map(()=>[]),orders:[]};state.quick??=[];state.held??=[];state.payments??=[];
let table=0,view="quick",category="Draught",product=null,preferredMeasures={Draught:"Pint",Spirits:"Single",Wine:"125ml","Soft Drinks":"Small"};const current=()=>view==="quick"?state.quick:state.tabs[table];const label=()=>view==="quick"?"Quick Sale":"Table "+(table+1);
const save=()=>localStorage.setItem(key,JSON.stringify(state));
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function button(text,fn){const b=node("button",text);b.onclick=fn;return b}
function show(v){view=v;render()}
function render(){const nav=$("nav");nav.replaceChildren();for(const v of ["quick","tables","till","kitchen","bar"]){const b=button(v.toUpperCase(),()=>show(v));if(view===v)b.className="active";nav.append(b)}
const screen=$("screen");screen.replaceChildren();
if(view==="tables"){screen.append(node("h2","Table plan"));const grid=node("div","");grid.className="grid";tables.forEach((covers,i)=>grid.append(button("Table "+(i+1)+" · "+covers+" covers"+(i<2?" · Dog":"")+" · "+state.tabs[i].length+" items",()=>{table=i;show("till")})));screen.append(grid)}
if(view==="quick"&&state.held.length){screen.append(button("Recall Held Sale ("+state.held.length+")",()=>{if(state.quick.length)return alert("Clear or hold the current quick sale first.");state.quick=state.held.pop();save();render()}))}
if(view==="till"||view==="quick"){screen.append(node("h2",view==="quick"?"Quick Sale · Bar & Counter":"Table "+(table+1)+" · Ordering"));const tabs=node("div","");tabs.className="category-tabs";for(const c of [...new Set(items.map(x=>x[1]))]){const b=button(c,()=>{category=c;render()});if(category===c)b.className="active";tabs.append(b)}screen.append(tabs);const measureBar=node("div","");measureBar.className="measure-bar";const sizes=category==="Draught"?["Pint","Half"]:category==="Spirits"?["Single","Double"]:category==="Wine"?["125ml","250ml","Bottle"]:category==="Soft Drinks"?["Small","Large"]:[];for(const size of sizes){const b=button(size,()=>{preferredMeasures[category]=size;render()},preferredMeasures[category]===size?"active":"");measureBar.append(b)}if(sizes.length)screen.append(measureBar);const grid=node("div","");grid.className="grid products";items.filter(x=>x[1]===category).forEach(p=>{const size=preferredMeasures[category];const amount=p[4]?(p[4][size]??Object.values(p[4])[0]):p[2];const b=button("",()=>openItem(p),"product-tile");b.append(node("strong",p[0]),node("small",money(amount)));grid.append(b)});screen.append(grid)}
if(view==="kitchen"||view==="bar"){screen.append(node("h2",view==="kitchen"?"Kitchen orders":"Bar orders"));const orders=state.orders.filter(x=>x.route===view&&x.status!=="collected");if(!orders.length)screen.append(node("p","No outstanding orders"));for(const o of orders){const box=node("section","");box.className="panel";box.append(node("h3",o.origin+" — "+o.status));for(const i of o.items){const l=node("div","1 × "+i.name+(i.measure?" ("+i.measure+")":"")+(i.modifier?" + "+i.modifier:"")+(i.note?" — "+i.note:"")+(i.seat?" · Seat "+i.seat:""));l.className="line";box.append(l)}if(view==="kitchen"){const counts={};o.items.forEach(i=>counts[i.name]=(counts[i.name]||0)+1);box.append(node("strong","DISH SUMMARY"));for(const [name,count] of Object.entries(counts))box.append(node("div",count+" × "+name))}const next={new:"preparing",preparing:"ready",ready:"collected"}[o.status];box.append(button(next==="preparing"?"Start preparing":next==="ready"?"Mark ready":"Mark collected",()=>{o.status=next;save();render()}));screen.append(box)}}
$("tableTitle").textContent=label();const tab=$("tab");tab.replaceChildren();let total=0;current().forEach((i,index)=>{total+=i.price;const line=node("div",i.name+(i.measure?" · "+i.measure:"")+" — "+money(i.price)+(i.modifier?"\n↳ "+i.modifier:"")+(i.note?"\nNOTE: "+i.note:""));line.className="line";line.style.whiteSpace="pre-line";if(!i.sent)line.append(button("Remove",()=>{current().splice(index,1);save();render()}));tab.append(line)});$("total").textContent="Total "+money(total)}
function openItem(p){product=p;$("itemTitle").textContent=p[0];const measure=$("measure");measure.replaceChildren();for(const m of Object.keys(p[4]||{"Standard":p[2]}))measure.append(new Option(m,m));if(p[4]&&Object.hasOwn(p[4],preferredMeasures[p[1]]))measure.value=preferredMeasures[p[1]];const modifier=$("modifier");modifier.replaceChildren();modifier.append(new Option("None",""));for(const m of p[1]==="Spirits"?mixers:p[1]==="Draught"?lager:[])modifier.append(new Option(m,m));$("mixerLabel").classList.toggle("hidden",p[1]!=="Spirits");$("mixerPrice").value="";$("note").value="";$("seat").value="";$("dialog").showModal()}
$("cancel").onclick=()=>$("dialog").close();$("add").onclick=()=>{const p=product,m=$("measure").value,mod=$("modifier").value,extra=p[1]==="Spirits"&&mod?Math.round(Number($("mixerPrice").value)*100):0;if(p[1]==="Spirits"&&mod&&(!Number.isFinite(extra)||extra<=0))return alert("Enter a positive mixer price");current().push({name:p[0],route:p[3],measure:p[4]?m:"",modifier:mod,price:(p[4]?p[4][m]:p[2])+extra,note:$("note").value.trim(),seat:$("seat").value,sent:false});save();$("dialog").close();render()};
$("send").onclick=()=>{const pending=current().filter(x=>!x.sent);for(const route of ["kitchen","bar"]){const lines=pending.filter(x=>x.route===route);if(lines.length)state.orders.push({origin:label(),route,status:"new",items:structuredClone(lines)})}pending.forEach(x=>x.sent=true);save();render();alert("Sent to DEMO queues only — no real printers")};
$("clear").onclick=()=>{if(confirm("Clear current demo draft?")){if(view==="quick")state.quick=[];else state.tabs[table]=[];save();render()}};
$("hold").onclick=()=>{if(view!=="quick")return alert("Hold Sale is for Quick Sale only.");if(!state.quick.length)return;state.held.push(structuredClone(state.quick));state.quick=[];save();render();alert("Quick sale held. Use Recall Held to restore it.")};
$("pay").onclick=()=>{const total=current().reduce((sum,x)=>sum+x.price,0);if(!total)return alert("No items to pay.");const method=prompt("Demo payment method: enter CASH or CARD","CARD");if(method===null)return;const m=method.trim().toUpperCase();if(!["CASH","CARD"].includes(m))return alert("Choose CASH or CARD.");if(!confirm("Record "+money(total)+" as "+m+"? No actual payment is taken."))return;state.payments.push({origin:label(),method:m,amount:total,at:new Date().toISOString()});if(view==="quick")state.quick=[];else state.tabs[table]=[];save();render();alert("Demo payment recorded. No card terminal was charged.")};
for(let i=1;i<=12;i++)$("seat").append(new Option(String(i),String(i)));$("seat").prepend(new Option("Unassigned",""));render();
</script></html>
