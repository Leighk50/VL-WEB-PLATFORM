name: EPOS staging deployment

on:
  workflow_dispatch:
  push:
    branches:
      - feature/epos-catalogue-v01
    paths:
      - "public/epos-demo.html"
      - "public/epos-product-admin.html"
      - "public/epos-mobile-v1.css"
      - "public/epos-licensing.html"
      - "public/epos-shared-test.html"
      - "public/epos-device-registration.html"
      - "public/epos-manager-preview.html"
      - "public/kitchen-display-preview.html"
      - "public/epos-catalogue-preview.html"
      - "epos/**"
      - ".github/workflows/epos-staging.yml"

permissions:
  contents: read

concurrency:
  group: vl-epos-staging
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate EPOS source and tests
        run: |
          node --check epos/catalogue.js
          node --test epos/catalogue.test.js epos/admin-integration.test.js epos/catalogue-import.test.js epos/shared-orders.test.js epos/shared-read-api.test.js epos/device-auth.test.js epos/device-pairing.test.js epos/shared-till.test.js epos/site-licensing.test.js epos/browser-licensing.test.js epos/licence-management.test.js epos/master-till.test.js epos/print-queue.test.js epos/bill-print.test.js epos/starter-serving.test.js
      - name: Build isolated EPOS staging package
        run: |
          mkdir -p epos-staging
          cp public/epos-demo.html epos-staging/index.html
          cp public/epos-product-admin.html epos-staging/product-admin.html
          cp public/epos-mobile-v1.css epos-staging/epos-mobile-v1.css
          cp public/epos-licensing.html epos-staging/licensing.html
          cp epos/pwa/manifest.webmanifest epos-staging/manifest.webmanifest
          cp epos/pwa/icon.svg epos-staging/icon.svg
          cp epos/pwa/service-worker.js epos-staging/service-worker.js
          cp public/epos-shared-test.html epos-staging/shared.html
          cp public/epos-device-registration.html epos-staging/devices.html
          cp public/epos-manager-preview.html epos-staging/manager.html
          cp public/kitchen-display-preview.html epos-staging/kitchen.html
          cp public/epos-catalogue-preview.html epos-staging/catalogue.html
          cp epos/catalogue-import.json epos-staging/catalogue-data.json
          cp epos/staging-server.js epos-staging/server.js
          cp epos/shared-read-api.js epos-staging/shared-read-api.js
          cp epos/device-auth.js epos-staging/device-auth.js
          cp epos/device-pairing.js epos-staging/device-pairing.js
          cp epos/shared-orders.js epos-staging/shared-orders.js
          cp epos/shared-till.js epos-staging/shared-till.js
          cp epos/site-licensing.js epos-staging/site-licensing.js
          cp epos/master-till.js epos-staging/master-till.js
          cp epos/print-queue.js epos-staging/print-queue.js
          cp epos/bill-print.js epos-staging/bill-print.js
          cp epos/print-service-auth.js epos-staging/print-service-auth.js
          cp epos/printer-monitoring.js epos-staging/printer-monitoring.js
          cp epos/product-management.js epos-staging/product-management.js
          cp epos/licence-approval.js epos-staging/licence-approval.js
          cp epos/staging-package.json epos-staging/package.json
          cd epos-staging
          npm install --omit=dev --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: epos-staging-package
          path: epos-staging/
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: epos-staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: epos-staging-package
          path: epos-staging
      - name: Check staging deployment configuration
        env:
          TARGET: ${{ vars.EPOS_STAGING_APP_NAME }}
          PROFILE: ${{ secrets.EPOS_STAGING_PUBLISH_PROFILE }}
        run: |
          test -n "$TARGET" || { echo "Set EPOS_STAGING_APP_NAME"; exit 1; }
          test -n "$PROFILE" || { echo "Set EPOS_STAGING_PUBLISH_PROFILE"; exit 1; }
          test "$TARGET" = "VL-EPOS-STAGING" || { echo "Unexpected deployment target; refusing to deploy"; exit 1; }
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.EPOS_STAGING_APP_NAME }}
          publish-profile: ${{ secrets.EPOS_STAGING_PUBLISH_PROFILE }}
          package: epos-staging
