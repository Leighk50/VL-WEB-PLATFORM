# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - VLWEB2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install, build and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Preserve current website content
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            https://villagelimits.co.uk/api/content \
            --output "$RUNNER_TEMP/live-content.json"
          node - "$RUNNER_TEMP/live-content.json" <<'NODE'
          const fs = require('fs');
          const content = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(content.menus) || !content.menus.some(menu => menu.id === 'main') || !Array.isArray(content.events)) {
            throw new Error('Live content is incomplete; stopping deployment to protect menu edits.');
          }
          fs.copyFileSync(process.argv[2], 'data/live-content-backup.json');
          NODE

      - name: Preserve uploaded event images
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          (async () => {
            const content = JSON.parse(fs.readFileSync('data/live-content-backup.json', 'utf8'));
            const urls = [...new Set(content.events.map(event => event.image).filter(image => typeof image === 'string' && image.startsWith('/uploads/')))];
            fs.mkdirSync('data/uploads', {recursive:true});
            for (const url of urls) {
              const name = path.basename(url);
              if (url !== `/uploads/${name}`) throw new Error(`Invalid event image path: ${url}`);
              const response = await fetch(`https://www.villagelimits.co.uk${url}`, {signal:AbortSignal.timeout(30000)});
              if (!response.ok || !response.headers.get('content-type')?.startsWith('image/')) throw new Error(`Event image backup failed: ${url}`);
              fs.writeFileSync(path.join('data/uploads', name), Buffer.from(await response.arrayBuffer()));
            }
            console.log(`Preserved ${urls.length} uploaded event images.`);
          })().catch(error => {console.error(error);process.exitCode = 1});
          NODE

      - name: Keep a pre-deployment content backup
        uses: actions/upload-artifact@v4
        with:
          name: live-content-before-deploy-${{ github.run_attempt }}
          path: |
            data/live-content-backup.json
            data/uploads/
          retention-days: 90

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: VLWEB2026
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
