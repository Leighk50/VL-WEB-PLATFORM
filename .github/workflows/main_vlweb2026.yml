# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - VLWEB2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install, build and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Preserve current website content
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            https://villagelimits.co.uk/api/content \
            --output "$RUNNER_TEMP/live-content.json"
          node - "$RUNNER_TEMP/live-content.json" <<'NODE'
          const fs = require('fs');
          const content = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(content.menus) || !content.menus.some(menu => menu.id === 'main') || !Array.isArray(content.events)) {
            throw new Error('Live content is incomplete; stopping deployment to protect menu edits.');
          }
          fs.copyFileSync(process.argv[2], 'data/content.json');
          NODE

      - name: Keep a pre-deployment content backup
        uses: actions/upload-artifact@v4
        with:
          name: live-content-before-deploy-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-content.json
          retention-days: 90

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: VLWEB2026
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
